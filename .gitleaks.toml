# Gitleaks configuration for RevoShop
# Extends the default ruleset, then allowlists known non-secrets.

[extend]
useDefault = true

[allowlist]
description = "Allowlist for seed/demo credentials that are not real secrets"

# Demo/seed passwords used only to populate the local dev database.
# These are intentional sample data, not production credentials.
regexes = [
  '''password\s*=\s*["']admin123["']''',
  '''Password1234''',
]

# Files that legitimately contain placeholder/example values.
paths = [
  '''\.env\.example$''',
  '''seeds/.*''',
  '''README\.md$''',
  # Docs: example snap_token and a legacy DB dump of seed test-user password
  # hashes (not real secrets). docs/seed.sql is now gitignored; allowlisted so
  # history scans don't fail on it.
  '''docs/seed\.sql$''',
  '''docs/payment_steps_with_midtrans\.md$''',
]
